name: wagmitips-researcher

on:
  schedule:
    - cron: '0 4 * * 1,3,5'  # Mon/Wed/Fri 12:00 PM KL (UTC+8)
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run researcher
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SHEET_ENDPOINT: "https://script.google.com/macros/s/AKfycbwM8AipWEp68H0sNFiMXslg1aSMwaSsiGOc3Xxlpc6Y8Ogxt_W6Po1J_1TBaTkxxJOhgg/exec"
          GOOGLE_SHEET_API_SECRET: ${{ secrets.GOOGLE_SHEET_API_SECRET }}
        run: python scripts/researcher.py

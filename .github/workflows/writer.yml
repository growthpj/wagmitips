name: wagmitips-writer

on:
  schedule:
    - cron: '0 5 * * *'  # Daily 1:00 PM KL (UTC+8)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic Pillow

      - name: Run writer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.WAGMI_GITHUB_TOKEN }}
          WAGMI_ARTICLE_API_KEY: ${{ secrets.WAGMI_ARTICLE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SHEET_ENDPOINT: "https://script.google.com/macros/s/AKfycbwM8AipWEp68H0sNFiMXslg1aSMwaSsiGOc3Xxlpc6Y8Ogxt_W6Po1J_1TBaTkxxJOhgg/exec"
          GOOGLE_SHEET_API_SECRET: ${{ secrets.GOOGLE_SHEET_API_SECRET }}
        run: python scripts/writer.py
